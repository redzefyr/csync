# csync configuration. Lives in the sync repo, so every machine reads the same
# values -- which matters for workspace_dir in particular: it is the literal
# directory name inside each project, so two machines that disagree end up with
# two unrelated directories.
#
# Format is `key = value`, one per line. Deliberately not JSON: this file is
# read on every session start, and it must not need python3 or jq to parse.

# Directory csync creates inside each connected project. Freely settable until
# the first project is connected; after that, changing it is a rename in every
# project on every machine -- see `/csync config`.
workspace_dir = .csync

# Whether `/csync open` renames the session to the pipeline it took up.
# on | off. Off by default: the rename overwrites a title you set by hand.
auto_title = off
